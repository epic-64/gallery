[project]
name = "woop"
version = "0.1.0"
description = "A Tkinter GUI for batch-renaming and organizing image files."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "epic-64", email = "105014007+epic-64@users.noreply.github.com" },
]
dependencies = [
    "pillow>=12.0.0",
    "piexif>=1.1.3",
]

[project.scripts]
woop = "woop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "ty>=0.0.4",
    "pytest>=8.4.1",
    "pytest-cov>=7.0.0",
    "types-Pillow",
    "pyinstaller>=6.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B", "B9", "I", "ERA", "PT", "S", "PT", "UP", "SIM"]
ignore = [
    "S603",
    "S607",
    "S606",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert statements are common in tests
