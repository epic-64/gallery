[project]
name = "woop"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.0.0",
    "piexif>=1.1.3",
]

[project.scripts]
woop = "woop.main:main"

[dependency-groups]
dev = [
    "ruff>=0.14.8",
    "ty",
    "pytest>=8.4.1",
    "pytest-cov>=7.0.0",
    "types-Pillow",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B", "B9", "I", "ERA", "PT", "S", "PT", "UP", "SIM"]
ignore = [
    "S603",
    "S607",
    "S606",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert statements are common in tests